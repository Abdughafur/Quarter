<!DOCTYPE html>
<html lang="tg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Чоряк - Зеркашӣ дар дастрас нест</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f2f8ff 0%, #eaf6ff 100%);
      color: #06273b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 26px;
      box-shadow: 0 18px 46px rgba(14, 43, 77, 0.08);
      padding: 40px 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: rgba(239, 68, 68, 0.08);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ef4444;
      margin-top: 5px;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.3;
    }

    .description {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: 16px;
      text-decoration: none;
      width: 100%;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: translateY(0);
      opacity: 0.9;
    }
  </style>
</head>

  <main class="container">
    <section class="tab active">
